# Git hooks managed by lefthook (https://lefthook.dev).
# Run any hook by hand: `npx lefthook run <hook>`. Bypass for one push: `git push --no-verify`.
pre-commit:
  commands:
    oxfmt:
      # oxfmt has no parser for .astro/.svg — keep those indented by hand (tabs).
      glob: "*.{js,cjs,mjs,cts,mts,ts,tsx,jsx,json,jsonc,css,md,toml}"
      run: npx oxfmt {staged_files}
      stage_fixed: true

pre-push:
  commands:
    test:
      # `test` is `astro check` until a real test runner lands.
      run: npm run test
    audit:
      # Gate is high: highs/criticals must be fixed or explicitly waived (severity policy in
      # .agents/skills/npm-audit-fix/SKILL.md). Deliberate dependency pins live in
      # package.json `overrides` — the canonical record; don't remove entries without
      # re-running the audit.
      run: npm run audit
